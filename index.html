<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Visitas a Sucursales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--nav:#0F2F4D;--ac:#14808A;--ink:#1B2733;--mut:#5F6B77;--line:#DDE3E8;--bg:#F3F6F8;--ok:#2E8B57;--warn:#D98E04;--bad:#C8372D;font-family:'Source Sans 3',system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:15px}[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:var(--nav)}
.lbox{background:#fff;padding:32px;border-radius:6px;width:min(360px,92vw)}
.lbox h1{font-size:20px;margin:12px 0 4px}.lbox p{color:var(--mut);margin:0 0 16px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
button{cursor:pointer;border:0;border-radius:4px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600}button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--bad)}button.sm{padding:4px 10px;font-size:13px}button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}.logo img{max-height:40px;max-width:150px}.mono{width:38px;height:38px;border-radius:6px;background:var(--ac);color:#fff;display:grid;place-items:center}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--nav);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
aside .logo{color:#fff;margin-bottom:18px}aside button{background:none;text-align:left;color:#C9D6E2;padding:10px 12px}aside button.on{background:rgba(255,255,255,.12);color:#fff}
aside .me{margin-top:auto;font-size:13px;color:#C9D6E2}
main{padding:22px 26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:22px}h3{margin:0 0 10px;font-size:16px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.filters label{font-size:13px;color:var(--mut);display:grid;gap:3px;min-width:170px}
.grid{display:grid;gap:14px}.k5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.kpi b{font-size:28px;display:block}.kpi span{color:var(--mut);font-size:13px}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar{height:12px;background:#E8EDF1;border-radius:6px;position:relative;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.bar2{height:8px;margin-top:3px}small,.mut{color:var(--mut);font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:#DDF1E5;color:#1D6B40}.warn{background:#FCEBC8;color:#8A5A00}.bad{background:#F8D9D6;color:#9A271F}.gr{background:#E8EDF1;color:#44505B}
#map{height:380px;border-radius:6px}.leg{display:flex;gap:14px;font-size:13px;margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12.5px;color:var(--mut)}
.hm{text-align:center;font-weight:600}.fm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.fm label{font-size:13px;color:var(--mut);display:grid;gap:3px}
.txt li{margin:0 0 8px;font-size:14px}.txt ul{padding-left:18px;margin:0;max-height:300px;overflow:auto}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;z-index:9999}
.err{color:var(--bad);font-size:14px;margin-top:8px}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside .logo{margin:0 8px 0 0}aside .me{margin:0 0 0 auto}main{padding:16px}}
</style></head><body>
<div id="login"><form class="lbox" id="lf"><div class="logo"><span class="LG"></span></div><h1>Control de Visitas a Sucursales</h1><p>Ingrese con su usuario corporativo.</p>
<label class="mut">Usuario<input id="u" autocomplete="username" required></label><br><br>
<label class="mut">Contraseña<input id="p" type="password" autocomplete="current-password" required></label><br>
<button style="width:100%" id="lb">Ingresar</button><div class="err" id="le"></div></form></div>
<div id="app" hidden><aside><div class="logo"><span class="LG"></span></div>
<button data-t="panel">Panel ejecutivo</button><button data-t="crono">Cronograma</button><button data-t="informe">Informe de resultados</button>
<div class="me"><span id="who"></span><br><button class="sec sm" id="out" style="margin-top:8px">Cerrar sesión</button></div></aside>
<main><div class="top"><h2 id="ttl"></h2><div><small id="gen"></small> <button class="sec sm" id="ref">Actualizar datos</button></div></div><div id="view">Cargando…</div></main></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbzwVf1QynZ2Hhui7jQp3orukWgCg54_WtW6bexzn0hJi8EGZ-1_IPBZp-UtABRBpwE/exec';
const LOGO=''; // Pegue aquí la URL o data:image/png;base64,... del logotipo corporativo
const PREG=['Conoce a su equipo y muestra cercanía','Brinda retroalimentación y reconocimiento','Es referente de apoyo y guía','Gestiona dificultades y conflictos','Comportamientos coherentes con la cultura','Ambiente positivo y de confianza','Colaboradores explican los valores','Ejemplos concretos de valores vividos','Uniforme completo, limpio y en buen estado','Presentación personal e identificación','Área de atención limpia y ordenada','Estantes y exhibidores ordenados y atractivos'];
const AREAS=[{n:'Liderazgo y acompañamiento de equipos',q:[0,1,2,3]},{n:'Cultura organizacional',q:[4,5]},{n:'Valores organizacionales',q:[6,7]},{n:'Imagen y presentación profesional',q:[8,9]},{n:'Orden, limpieza y presentación de la sala de ventas',q:[10,11]}];
const TXT=['Principales fortalezas observadas','Oportunidades de mejora identificadas','Buenas prácticas replicables en otras sucursales','Necesidades de capacitación o acompañamiento de liderazgo'];
const TITLES={panel:'Panel ejecutivo',crono:'Cronograma de visitas',informe:'Informe de resultados'};
const HOY=new Date().toISOString().slice(0,10);
let U=null,D=null,map=null;const S={tab:'panel',mes:HOY.slice(0,7),ciudad:'',cp:'',ce:'',im:'',ip:'',is:'',ic:'',sc:'',sa:'',sb:''};
const $=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tc=s=>String(s).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,4000)};
document.querySelectorAll('.LG').forEach(x=>x.innerHTML=LOGO?`<img src="${e(LOGO)}" alt="Logotipo">`:'<span class="mono">CV</span> Control de Visitas');
async function api(action,x={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,usuario:U.usuario,clave:U.clave,...x})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j}
async function load(){try{D=(await api('getData')).data;prep();render()}catch(x){$('#view').innerHTML=`<div class="err">No se pudo cargar: ${e(x.message)}</div>`}}
$('#lf').onsubmit=async ev=>{ev.preventDefault();$('#lb').disabled=true;$('#le').textContent='';U={usuario:$('#u').value.trim().toLowerCase(),clave:$('#p').value};
 try{const j=await api('login');U.persona=j.persona;try{sessionStorage.setItem('cv',JSON.stringify(U))}catch(_){}start()}catch(x){U=null;$('#le').textContent=x.message}$('#lb').disabled=false};
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=tc(U.persona);S.cp=U.persona;load()}
$('#out').onclick=()=>{try{sessionStorage.removeItem('cv')}catch(_){}location.reload()};$('#ref').onclick=load;
document.querySelectorAll('aside [data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
document.addEventListener('change',ev=>{const k=ev.target.dataset.k;if(k){S[k]=ev.target.value;render()}});
try{const s=JSON.parse(sessionStorage.getItem('cv')||'null');if(s){U=s;start()}}catch(_){}

/* ---------- Modelo ---------- */
function prep(){D.sucBy={};D.sucursales.forEach(s=>D.sucBy[s.key]=s);D.visBy={};D.respuestas.forEach(r=>(D.visBy[r.key]=D.visBy[r.key]||[]).push(r));
 D.meses=[...new Set(['2026-09','2026-10','2026-11','2026-12',...D.respuestas.filter(r=>r.semanaInicio).map(r=>r.semanaInicio.slice(0,7))])].sort();
 D.deptos=[...new Set(D.sucursales.map(s=>s.departamento).filter(Boolean))].sort();D.sups=[...new Set(D.sucursales.map(s=>s.supervisora).filter(x=>x&&!/FALTA/i.test(x)))].sort();
 D.personas=D.equipo.map(p=>p.persona).sort();if(!D.meses.includes(S.mes))S.mes=D.meses[D.meses.length-1]}
const dep=k=>(D.sucBy[k]||{}).departamento||'',sup=k=>(D.sucBy[k]||{}).supervisora||'',mw=r=>r.semanaInicio?r.semanaInicio.slice(0,7):'';
const lunes=m=>{const[y,mo]=m.split('-').map(Number),a=[];for(let d=new Date(Date.UTC(y,mo-1,1));d.getUTCMonth()==mo-1;d.setUTCDate(d.getUTCDate()+1))if(d.getUTCDay()==1)a.push(d.toISOString().slice(0,10));return a};
const esperado=m=>Math.min(4,lunes(m).filter(x=>x<=HOY).length);
function cumpl(p,m){const rs=D.respuestas.filter(r=>r.persona===p&&mw(r)===m),v=rs.length,w=new Set(rs.map(r=>r.semanaInicio)).size,x=esperado(m);let st;
 if(!v)st=x?'Sin visitas':'Pendiente';else if(w>=Math.max(x,1))st=(v>=4&&w>=4)?'Cumple':'Al día';else st=v>w?'Concentrada':'Atrasada';return{v,w,x,st}}
const cls=st=>({'Cumple':'ok','Al día':'ok','Concentrada':'warn','Atrasada':'bad','Sin visitas':'bad','Pendiente':'gr','Aprobada':'ok','Rechazada':'bad','Cancelada':'gr'}[st]||'warn');
const chip=st=>`<span class="chip ${cls(st)}">${e(st)}</span>`;
const avg=a=>{a=a.filter(v=>v!==null&&v!==undefined);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null};
const pct=v=>v===null?'s/d':Math.round(v*100)+'%',sem=v=>v===null?'gr':v>=.9?'ok':v>=.75?'warn':'bad',col={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)',gr:'#9AA6B1'};
const aScore=(rs,q)=>avg(rs.flatMap(r=>q.map(i=>r.scores[i])));
const filt=f=>D.respuestas.filter(r=>(!f.mes||mw(r)===f.mes)&&(!f.ciudad||dep(r.key)===f.ciudad)&&(!f.persona||r.persona===f.persona)&&(!f.sup||sup(r.key)===f.sup));
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.round(p*100))}%;background:${c}"></i></div>`;
const sel=(k,lab,opts,all)=>`<label>${lab}<select data-k="${k}">${all?`<option value="">${all}</option>`:''}${opts.map(o=>{o=Array.isArray(o)?o:[o,o];return`<option value="${e(o[0])}"${S[k]===o[0]?' selected':''}>${e(o[1])}</option>`}).join('')}</select></label>`;
const mesL=m=>{const[y,n]=m.split('-');return['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+n]+' '+y};
const mesOpts=()=>D.meses.map(m=>[m,mesL(m)]);

function render(){document.querySelectorAll('aside [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));$('#ttl').textContent=TITLES[S.tab];
 $('#gen').textContent='Datos al '+D.generado.replace('T',' ').slice(0,16);if(map){map.remove();map=null}
 $('#view').innerHTML={panel,crono,informe}[S.tab]();if(S.tab==='panel')drawMap();if(S.tab==='crono')bindForm()}

/* ---------- 1. Panel ejecutivo ---------- */
function panel(){const c=S.ciudad,m=S.mes;
 const keys=[...new Set(D.cronograma.map(f=>f.key))].filter(k=>!c||dep(k)===c),vis=keys.filter(k=>D.visBy[k]);
 const per=D.equipo.filter(p=>!c||p.regional===c).map(p=>({...p,...cumpl(p.persona,m)})),ok=per.filter(p=>p.st==='Cumple'||p.st==='Al día').length;
 const rsM=filt({mes:m,ciudad:c}),glob=avg(filt({ciudad:c}).flatMap(r=>r.scores));
 const meses=D.meses.map(x=>{const ps=D.equipo.filter(p=>!c||p.regional===c);return{m:x,meta:ps.length*4,real:ps.reduce((s,p)=>s+cumpl(p.persona,x).v,0)}}),mx=Math.max(1,...meses.map(x=>Math.max(x.meta,x.real)));
 const deps=D.deptos.filter(d=>!c||d===c).map(d=>{const k=keys.filter(x=>dep(x)===d);return{d,n:k.length,v:k.filter(x=>D.visBy[x]).length}}).filter(x=>x.n);
 const hall=AREAS.map(a=>({n:a.n,v:aScore(rsM,a.q),nc:rsM.reduce((s,r)=>s+a.q.filter(i=>r.scores[i]===0||r.scores[i]===.5).length,0)}));
 return`<div class="filters">${sel('ciudad','Ciudad / departamento',D.deptos,'Todas')}${sel('mes','Mes',mesOpts())}</div>
<div class="grid k5"><div class="card kpi"><b>${keys.length}</b><span>Sucursales programadas</span></div><div class="card kpi"><b>${vis.length}</b><span>Visitadas (${keys.length?Math.round(vis.length/keys.length*100):0}% de avance)</span></div>
<div class="card kpi"><b>${per.reduce((s,p)=>s+p.v,0)}</b><span>Visitas en ${mesL(m)}</span></div><div class="card kpi"><b>${ok}/${per.length}</b><span>Colaboradores al día en ${mesL(m)}</span></div><div class="card kpi"><b>${pct(glob)}</b><span>Cumplimiento promedio del formulario</span></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Visitas por colaborador · ${mesL(m)}</h3><small>Meta: 4 visitas, una por semana (lunes a domingo). La marca indica las semanas transcurridas.</small>
${per.map(p=>`<div class="row"><div>${e(tc(p.persona))}<br><small>${e(tc(p.cargo))}</small></div><div>${bar(p.v/4,col[cls(p.st)])}<small>${p.v} visitas en ${p.w} semana(s) distintas · esperado a la fecha: ${p.x}</small></div>${chip(p.st)}</div>`).join('')||'<small>Sin colaboradores para este filtro.</small>'}</div>
<div class="card"><h3>Planificado vs. ejecutado</h3>${meses.map(x=>`<div class="row" style="grid-template-columns:70px 1fr auto"><div>${mesL(x.m)}</div><div>${bar(x.meta/mx,'#B7C4D0')}<div class="bar bar2"><i style="width:${x.real/mx*100}%;background:var(--ac)"></i></div></div><small>${x.real}/${x.meta}</small></div>`).join('')}
<div class="leg"><span><i style="background:#B7C4D0"></i>Meta (4 por colaborador)</span><span><i style="background:var(--ac)"></i>Realizadas</span></div>
<h3 style="margin-top:18px">Distribución por departamento</h3>${deps.map(x=>`<div class="row" style="grid-template-columns:110px 1fr auto"><div>${e(x.d)}</div>${bar(x.v/x.n,'var(--ac)')}<small>${x.v}/${x.n}</small></div>`).join('')}</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Mapa de sucursales</h3><div id="map"></div><div class="leg"><span><i style="background:var(--ok)"></i>Visitada</span><span><i style="background:var(--bad)"></i>Programada sin visitar</span><span><i style="background:#9AA6B1"></i>Sin programar</span></div></div>
<div class="card"><h3>Resumen de hallazgos · ${mesL(m)}</h3><small>${rsM.length} visita(s) con cuestionario. Semáforo: verde ≥ 90 %, ámbar 75–89 %, rojo &lt; 75 %.</small>
${hall.map(h=>`<div class="row"><div>${e(h.n)}</div>${bar(h.v||0,col[sem(h.v)])}<span class="chip ${sem(h.v)}">${pct(h.v)}</span></div><small>${h.nc} respuesta(s) con "Parcialmente" o "No"</small>`).join('')}
<details style="margin-top:14px"><summary>Alertas de calidad de datos (${D.avisos.length})</summary><ul>${D.avisos.map(a=>`<li><small><b>${e(a.tipo)}</b>: ${e(a.detalle)}</small></li>`).join('')}</ul></details></div></div>`}
function drawMap(){const el=$('#map');if(!el||!window.L){if(el)el.innerHTML='<small>No se pudo cargar la librería de mapas.</small>';return}
 map=L.map(el).setView([-17.2,-64.5],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
 const prog=new Set(D.cronograma.map(f=>f.key)),pts=[];
 D.sucursales.filter(s=>s.lat!==null&&s.lng!==null&&(!S.ciudad||s.departamento===S.ciudad)).forEach(s=>{const v=D.visBy[s.key],c=v?'#2E8B57':prog.has(s.key)?'#C8372D':'#9AA6B1';
  L.circleMarker([s.lat,s.lng],{radius:7,color:'#fff',weight:1.5,fillColor:c,fillOpacity:.95}).addTo(map).bindPopup(`<b>${e(s.sucursal)}</b><br>${e(s.departamento)} · ${e(s.horario)}<br>Supervisora: ${e(s.supervisora)}<br>${v?'Visitada: '+v.map(r=>e(tc(r.persona))+' ('+r.fecha+')').join('; '):prog.has(s.key)?'Sin visitar':'Sin programar'}`);pts.push([s.lat,s.lng])});
 if(pts.length)map.fitBounds(pts,{padding:[20,20],maxZoom:12});setTimeout(()=>map&&map.invalidateSize(),150)}

/* ---------- 2. Cronograma ---------- */
function crono(){const p=S.cp,m=S.mes;let f=D.cronograma.filter(x=>!p||x.persona===p).map(x=>{const r=D.respuestas.find(y=>y.persona===x.persona&&y.key===x.key);return{...x,r}});
 const tot=f.length,hechas=f.filter(x=>x.r).length,cu=p?cumpl(p,m):null;if(S.ce==='v')f=f.filter(x=>x.r);if(S.ce==='p')f=f.filter(x=>!x.r);
 const mine=p===U.persona,sol=D.solicitudes,porAprobar=sol.filter(s=>s.estado==='Pendiente'&&s.aprobador===U.persona);
 const propias=D.cronograma.filter(x=>x.persona===U.persona&&!D.respuestas.some(r=>r.persona===U.persona&&r.key===x.key));
 return`<div class="filters">${sel('cp','Colaborador',D.personas.map(x=>[x,tc(x)]),'Todos')}${sel('ce','Estado',[['v','Visitadas'],['p','Pendientes']],'Todas')}${sel('mes','Mes',mesOpts())}</div>
${p?`<div class="grid k5"><div class="card kpi"><b>${tot?Math.round(hechas/tot*100):0}%</b><span>Avance: ${hechas} de ${tot} sucursales visitadas</span></div><div class="card kpi"><b>${cu.v} / 4</b><span>Visitas en ${mesL(m)}</span></div><div class="card kpi"><b>${chip(cu.st)}</b><span>${cu.w} semana(s) distintas · esperado a la fecha: ${cu.x}</span></div></div>`:''}
<div class="card tw" style="margin-top:14px"><h3>Sucursales asignadas (${f.length})</h3><table><tr>${p?'':'<th>Colaborador</th>'}<th>Sucursal</th><th>Departamento</th><th>Supervisora</th><th>Estado</th><th></th></tr>
${f.map(x=>`<tr>${p?'':`<td>${e(tc(x.persona))}</td>`}<td>${e(x.sucursal)}</td><td>${e(dep(x.key))}</td><td>${e(sup(x.key))}</td><td>${x.r?`<span class="chip ok">Visitada</span> <small>${x.r.fecha}</small>`:'<span class="chip bad">Pendiente</span>'}</td>
<td>${mine&&!x.r?`<button class="sec sm" data-ch="${e(x.key)}">Solicitar cambio</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6"><small>No hay sucursales para este filtro.</small></td></tr>'}</table></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Cambiar asignación</h3><div class="fm"><label>Solicitante<input value="${e(tc(U.persona))}" disabled></label>
<label>Sucursal que cede<select id="fs">${propias.map(x=>`<option value="${e(x.key)}">${e(x.sucursal)}</option>`).join('')}</select></label>
<label>Aprobador<select id="fa"><option value="">Seleccione…</option>${D.personas.filter(x=>x!==U.persona).map(x=>`<option value="${e(x)}">${e(tc(x))}</option>`).join('')}</select></label>
<label>Sucursal solicitada<select id="fq"><option value="">Seleccione un aprobador</option></select></label></div>
<label class="mut" style="display:grid;gap:3px;margin-top:10px;font-size:13px">Motivo (opcional)<textarea id="fm" rows="2" maxlength="500"></textarea></label>
<p><small>Es un intercambio 1 a 1: al aprobar, ambos colaboradores intercambian sucursal en el Cronograma. No se pueden reasignar sucursales ya visitadas.</small></p><button id="fb">Enviar solicitud</button></div>
<div class="card"><h3>Solicitudes por aprobar (${porAprobar.length})</h3>${porAprobar.map(s=>`<div style="border-bottom:1px solid var(--line);padding:8px 0"><b>${e(tc(s.solicitante))}</b> cede <b>${e(s.cedida)}</b> y solicita <b>${e(s.solicitada)}</b>.<br><small>${e(s.motivo)}</small><br><button class="sm" data-ap="${e(s.id)}">Aprobar</button> <button class="sm bad" data-rj="${e(s.id)}">Rechazar</button></div>`).join('')||'<small>No tiene solicitudes pendientes de su aprobación.</small>'}</div></div>
<div class="card tw" style="margin-top:14px"><h3>Trazabilidad de solicitudes</h3><table><tr><th>Fecha</th><th>Solicitante</th><th>Cede</th><th>Aprobador</th><th>Solicita</th><th>Estado</th><th>Resolución</th><th></th></tr>
${[...sol].reverse().map(s=>`<tr><td>${e(s.fecha)}</td><td>${e(tc(s.solicitante))}</td><td>${e(s.cedida)}</td><td>${e(tc(s.aprobador))}</td><td>${e(s.solicitada)}</td><td>${chip(s.estado)}</td><td><small>${e(s.fechaResolucion)} ${e(s.comentario)}</small></td><td>${s.estado==='Pendiente'&&s.solicitante===U.persona?`<button class="sec sm" data-cn="${e(s.id)}">Cancelar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8"><small>Aún no hay solicitudes registradas.</small></td></tr>'}</table></div>`}
function bindForm(){const fa=$('#fa');if(!fa)return;
 fa.onchange=()=>{const l=D.cronograma.filter(x=>x.persona===fa.value&&!D.respuestas.some(r=>r.persona===x.persona&&r.key===x.key));$('#fq').innerHTML=l.length?l.map(x=>`<option value="${e(x.key)}">${e(x.sucursal)}</option>`).join(''):'<option value="">Sin sucursales pendientes</option>'};
 const run=async(fn,ok)=>{try{await fn();toast(ok);await load()}catch(x){toast(x.message)}};
 $('#fb').onclick=()=>{if(!$('#fs').value||!fa.value||!$('#fq').value)return toast('Complete sucursal, aprobador y sucursal solicitada.');
  run(()=>api('crearSolicitud',{sucursalCedida:$('#fs').value,aprobador:fa.value,sucursalSolicitada:$('#fq').value,motivo:$('#fm').value}),'Solicitud enviada')};
 document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{$('#fs').value=b.dataset.ch;$('#fs').scrollIntoView({behavior:'smooth',block:'center'})});
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>run(()=>api('aprobarSolicitud',{id:b.dataset.ap}),'Solicitud aprobada: el Cronograma fue actualizado'));
 document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{const c=prompt('Motivo del rechazo (opcional):');if(c!==null)run(()=>api('rechazarSolicitud',{id:b.dataset.rj,comentario:c}),'Solicitud rechazada')});
 document.querySelectorAll('[data-cn]').forEach(b=>b.onclick=()=>run(()=>api('cancelarSolicitud',{id:b.dataset.cn}),'Solicitud cancelada'))}

/* ---------- 3. Informe de resultados ---------- */
function informe(){const rs=filt({mes:S.im,persona:S.ip,sup:S.is,ciudad:S.ic}),n=rs.length;
 const qs=PREG.map((t,i)=>({t,i,v:avg(rs.map(r=>r.scores[i]))})),peor=[...qs].filter(q=>q.v!==null).sort((a,b)=>a.v-b.v).slice(0,3);
 const aR=AREAS.map(a=>({...a,v:aScore(rs,a.q)})),ig=avg(rs.flatMap(r=>r.scores));
 const bajo=aR.filter(a=>a.v!==null).sort((a,b)=>a.v-b.v)[0];
 return`<div class="filters">${sel('im','Mes',mesOpts(),'Todos')}${sel('ip','Colaborador',D.personas.map(x=>[x,tc(x)]),'Todos')}${sel('is','Supervisora',D.sups,'Todas')}${sel('ic','Departamento',D.deptos,'Todos')}</div>
<div class="grid k5"><div class="card kpi"><b>${n}</b><span>Visitas analizadas</span></div><div class="card kpi"><b>${pct(ig)}</b><span>Cumplimiento global</span></div><div class="card kpi"><b>${bajo?pct(bajo.v):'s/d'}</b><span>${bajo?'Área más baja: '+e(bajo.n):'Sin datos'}</span></div></div>
${n?'':'<div class="card" style="margin-top:14px">No hay visitas con este filtro. Cambie el mes, colaborador o supervisora.</div>'}
<div class="grid g2" style="margin-top:14px">${aR.map(a=>`<div class="card"><h3>${e(a.n)} <span class="chip ${sem(a.v)}">${pct(a.v)}</span></h3>${a.q.map(i=>`<div class="row" style="grid-template-columns:1fr 90px 44px"><small style="font-size:13.5px">${e(PREG[i])}</small>${bar(qs[i].v||0,col[sem(qs[i].v)])}<small>${pct(qs[i].v)}</small></div>`).join('')}</div>`).join('')}
<div class="card"><h3>¿Dónde debemos trabajar?</h3><small>Los tres criterios con menor cumplimiento en la selección actual.</small>${peor.map((q,k)=>`<div class="row" style="grid-template-columns:1fr auto"><div>${e(q.t)}</div><span class="chip ${sem(q.v)}">${pct(q.v)}</span></div>`).join('')||'<br><small>Sin datos.</small>'}
<p><small>Escala: Sí = 100 %, Parcialmente = 50 %, No = 0 %. N/A y respuestas vacías no promedian.</small></p></div></div>
<div class="card tw" style="margin-top:14px"><h3>Mapa de calor por sucursal visitada</h3><table><tr><th>Sucursal</th><th>Fecha</th><th>Realizado por</th>${AREAS.map(a=>`<th>${e(a.n.split(' ')[0])}</th>`).join('')}<th>Global</th></tr>
${[...rs].sort((a,b)=>(avg(a.scores)??2)-(avg(b.scores)??2)).map(r=>`<tr><td>${e(r.sucursal)}<br><small>${e(r.regente)}</small></td><td>${r.fecha||''}</td><td>${e(tc(r.persona))}</td>${AREAS.map(a=>{const v=aScore([r],a.q);return`<td class="hm"><span class="chip ${sem(v)}">${pct(v)}</span></td>`}).join('')}<td class="hm"><span class="chip ${sem(avg(r.scores))}">${pct(avg(r.scores))}</span></td></tr>`).join('')}</table></div>
<div class="grid g2" style="margin-top:14px">${TXT.map((t,k)=>{const it=rs.filter(r=>r.textos[k]&&!/^(no requiere|ninguna?|n\/a|-+)\.?$/i.test(r.textos[k]));return`<div class="card txt"><h3>${e(t)} (${it.length})</h3><ul>${it.map(r=>`<li>${e(r.textos[k])}<br><small>${e(r.sucursal)} · ${r.fecha||''}</small></li>`).join('')||'<small>Sin registros.</small>'}</ul></div>`}).join('')}</div>`}
</script></body></html>
