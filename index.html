<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Visitas a Sucursales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--nav:#073B63;--nav2:#062B49;--ac:#009FDB;--ac2:#16B7E8;--ink:#182B3A;--mut:#637789;--line:#E1EAF0;--bg:#F3F7FA;--ok:#198754;--warn:#D99200;--bad:#D64545;--surface:#fff;--shadow:0 8px 24px rgba(15,49,75,.07);font-family:'Source Sans 3',system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:15px;line-height:1.45}[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 15%,rgba(0,159,219,.30),transparent 26%),linear-gradient(135deg,var(--nav2),var(--nav) 58%,#0879A8)}
.lbox{background:#fff;padding:36px;border-radius:20px;width:min(420px,94vw);box-shadow:0 24px 70px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.4)}
.lbox .logo{min-height:70px;justify-content:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}.lbox h1{font-size:24px;line-height:1.15;margin:12px 0 7px;letter-spacing:-.4px}.lbox p{color:var(--mut);margin:0 0 20px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #D4E0E8;border-radius:9px;background:#fff;color:var(--ink);transition:border-color .18s,box-shadow .18s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,159,219,.12)}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:linear-gradient(135deg,var(--ac),#087FB5);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(0,159,219,.15);transition:transform .15s,filter .15s}button:hover{filter:brightness(.97);transform:translateY(-1px)}button.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}button.bad{background:var(--bad)}button.sm{padding:5px 10px;font-size:13px}button:disabled{opacity:.5;cursor:wait;transform:none}
/* Separación visual entre el campo de contraseña y el botón de ingreso */
.lbox #lb{margin-top:12px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}.logo img{display:block;max-height:54px;max-width:205px;width:auto;height:auto;object-fit:contain}.mono{width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--nav2),var(--nav));color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:7px;box-shadow:5px 0 24px rgba(8,45,72,.08);z-index:2}
aside .logo{min-height:76px;color:#fff;margin:0 0 22px;padding:0 7px 18px;border-bottom:1px solid rgba(255,255,255,.15)}aside .logo img{max-width:205px;max-height:60px;filter:brightness(0) invert(1)}aside button{background:transparent;text-align:left;color:#C8D9E5;padding:12px 14px;box-shadow:none;border:1px solid transparent;font-weight:600}aside button:hover{background:rgba(255,255,255,.08);transform:none}aside button.on{background:linear-gradient(90deg,rgba(0,159,219,.28),rgba(255,255,255,.07));color:#fff;border-color:rgba(67,193,235,.28);box-shadow:inset 3px 0 var(--ac)}aside .me{margin-top:auto;font-size:13px;color:#C9D6E2;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.15)}
main{padding:28px 30px;min-width:0;max-width:1800px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:27px;letter-spacing:-.6px;font-weight:700;color:var(--nav)}h3{margin:0 0 13px;font-size:16px;color:var(--nav);font-weight:700}
#gen{display:inline-block;margin-right:8px;color:var(--mut);font-size:12px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px rgba(15,49,75,.025)}.filters label{font-size:12px;color:var(--mut);display:grid;gap:5px;min-width:170px;font-weight:700}
.grid{display:grid;gap:16px}.k5{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:19px;min-width:0;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}.card:hover{border-color:#CFDFE9;box-shadow:0 10px 28px rgba(15,49,75,.09)}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--ac);padding:19px 20px 18px}.kpi:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;background:rgba(0,159,219,.07);right:-26px;top:-30px}.kpi b{font-size:32px;line-height:1.1;display:block;color:var(--nav);letter-spacing:-.8px;margin-bottom:8px}.kpi span{color:var(--mut);font-size:12.5px;position:relative;z-index:1}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;margin:12px 0;font-size:14px}.bar{height:10px;background:#EAF0F4;border-radius:20px;position:relative;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px;transition:width .45s ease}.bar2{height:7px;margin-top:5px}small,.mut{color:var(--mut);font-size:12.5px}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
.ok{background:#DDF5E7;color:#17663B}.warn{background:#FFF0CC;color:#885800}.bad{background:#FCE2E0;color:#A52D2D}.gr{background:#EDF2F6;color:#526373}
#map{height:390px;border-radius:11px;overflow:hidden;border:1px solid var(--line)}.leg{display:flex;gap:14px;font-size:12px;margin-top:12px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tw{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11.5px;color:#516A7C;text-transform:uppercase;letter-spacing:.45px;background:#F5F9FB;position:sticky;top:0}tr:last-child td{border-bottom:0}tbody tr:hover,table tr:hover td{background:#F8FBFD}.hm{text-align:center;font-weight:600}.fm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.fm label{font-size:12px;color:var(--mut);display:grid;gap:5px;font-weight:700}
.txt li{margin:0 0 11px;font-size:13.5px}.txt ul{padding-left:18px;margin:0;max-height:300px;overflow:auto}details{border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--nav);font-weight:700}
#toast{position:fixed;bottom:22px;right:22px;background:var(--nav2);color:#fff;padding:12px 18px;border-radius:10px;z-index:9999;box-shadow:var(--shadow)}
.err{color:var(--bad);font-size:14px;margin-top:8px}
@media(max-width:1000px){#app{grid-template-columns:205px 1fr}main{padding:22px 18px}.row{grid-template-columns:minmax(100px,150px) 1fr auto;gap:8px}}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:5px}aside .logo{margin:0 8px 0 0;min-height:0;padding:0;border:0}aside .logo img{max-width:125px;max-height:38px}aside button{padding:9px 10px;font-size:13px}aside .me{margin:0 0 0 auto;padding:0;border:0}main{padding:16px}.top{margin-bottom:16px}h2{font-size:23px}.g2{grid-template-columns:minmax(0,1fr)}.filters label{min-width:145px;flex:1}.card{padding:15px}.row{grid-template-columns:minmax(90px,130px) 1fr auto;font-size:12.5px}}
@media(max-width:480px){aside .logo{width:100%;margin-bottom:5px}aside .me{margin-left:auto}.k5{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:26px}.row{grid-template-columns:1fr auto}.row .bar{grid-column:1/-1;grid-row:2}.row small{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* Experiencia visual más amable y colorida */

main{padding-top:25px}.top{border-bottom-color:#D8EDF5}.top h2{font-size:28px}.card{border-radius:19px;box-shadow:0 8px 24px rgba(6,93,130,.055)}.card:hover{border-color:#BFEAF7;box-shadow:0 12px 30px rgba(6,122,162,.095)}

.contributions{background:linear-gradient(145deg,#fff 0%,#F4FCFF 100%)}.mini-insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini-insight{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:#E8F9FF;border:1px solid #CDEFFA;min-width:0}.mini-insight.improve{background:#FFF0F0;border-color:#FFDDDD}.mini-insight.practice{background:#E9FFF6;border-color:#C8F4E3}.mini-insight.training{background:#F3EEFF;border-color:#E0D5FF}.mini-icon{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;background:rgba(255,255,255,.85);border-radius:12px;font-size:20px}.mini-insight div{min-width:0}.mini-insight b{display:block;font-size:23px;line-height:1.1;color:#075078}.mini-insight span:last-child{display:block;margin-top:3px;font-size:11.5px;color:#466276;line-height:1.25}

.report-kpis{margin-bottom:27px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.schedule-progress-card{border-left-color:#19BC8A!important}.schedule-progress-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}.schedule-progress-top>b{font-size:36px;line-height:1;color:#0879A8}.schedule-progress-top>span{font-size:13px;color:var(--mut);font-weight:700}.schedule-progress-track{height:12px;border-radius:999px;background:#E7F1F5;overflow:hidden;margin-bottom:10px}.schedule-progress-track>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#15CFA5,#00A6DE);transition:width .4s ease}.schedule-progress-card small{display:block;line-height:1.5;max-width:650px}.insight-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:27px 2px 13px}.insight-heading h3,.register-heading h3{font-size:20px;letter-spacing:-.2px;margin:0;color:#075078}.insight-heading>p{margin:0;max-width:440px;color:var(--mut);font-size:12.5px;line-height:1.5}.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.insight-card{--accent:#00A6DE;--tint:#E9F9FF;min-width:0;overflow:hidden;background:#fff;border:1px solid #DCECF3;border-radius:20px;box-shadow:0 9px 24px rgba(6,93,130,.055)}.insight-card.strength{--accent:#00A6DE;--tint:#E8F9FF}.insight-card.improve{--accent:#FF6D75;--tint:#FFF0F0}.insight-card.practice{--accent:#12B985;--tint:#E9FFF5}.insight-card.training{--accent:#8B68F5;--tint:#F3EFFF}.insight-head{position:relative;display:flex;align-items:flex-start;gap:12px;padding:19px 19px 16px;background:linear-gradient(120deg,var(--tint),#fff 86%);border-bottom:1px solid #EAF1F5}.insight-head:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}.insight-icon{display:grid;place-items:center;flex:0 0 47px;width:47px;height:47px;border-radius:15px;background:#fff;box-shadow:0 3px 10px rgba(10,68,94,.06);font-size:24px}.insight-title-wrap{min-width:0;flex:1}.insight-title-wrap h3{font-size:16px;line-height:1.3;margin:2px 0 4px;color:#103C58}.insight-title-wrap p{font-size:12px;margin:0;color:var(--mut);line-height:1.4}.insight-count{display:grid;place-items:center;flex:0 0 34px;min-width:34px;height:34px;padding:0 7px;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 8px rgba(10,68,94,.1)}.insight-list{display:grid;gap:10px;padding:14px;max-height:560px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#B9E6F4 transparent}.insight-list::-webkit-scrollbar{width:7px}.insight-list::-webkit-scrollbar-track{background:transparent}.insight-list::-webkit-scrollbar-thumb{background:#B9E6F4;border-radius:10px;border:2px solid #fff}.comment-item{min-width:0;padding:13px 14px;border:1px solid #E8F0F4;border-radius:14px;background:#FCFEFF;transition:transform .15s,border-color .15s,box-shadow .15s}.comment-item:hover{transform:translateY(-1px);border-color:#BFEAF7;box-shadow:0 5px 14px rgba(6,122,162,.06)}.comment-item p{margin:0 0 11px;font-size:13.5px;line-height:1.55;color:#28495E;overflow-wrap:anywhere}.comment-meta{display:flex;flex-wrap:wrap;gap:6px}.comment-meta span{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;background:var(--tint,#F0F7FA);color:#5D7789;font-size:10.5px;line-height:1.35}.insight-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px;color:var(--mut)}.insight-empty span{font-size:30px;margin-bottom:9px}.insight-empty b{font-size:13px;color:#31566D}.insight-empty small{max-width:250px;margin-top:6px;line-height:1.45}.register-card{margin-top:23px;padding:0;overflow:hidden}.register-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;background:linear-gradient(120deg,#E8F9FF,#fff);border-bottom:1px solid var(--line)}.register-heading p{margin:6px 0 0;color:var(--mut);font-size:12px}.register-card t /* Panel de preguntas cerradas y explorador de base de datos */
.score-note{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;margin:0 0 16px;border:1px solid #C8EBF7;border-radius:14px;background:linear-gradient(110deg,#E8F9FF,#F8FDFF);color:#42657A}
.score-note>span{font-size:20px;line-height:1.2}.score-note p{margin:0;font-size:12.5px;line-height:1.55}.score-note b{color:#075078}
.score-area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.score-area{--score:#00A6DE;--score-bg:#E8F9FF;overflow:hidden;border:1px solid #D8EDF5;border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(6,93,130,.045)}
.score-area.culture{--score:#12B985;--score-bg:#E9FFF5}.score-area.values{--score:#8B68F5;--score-bg:#F3EEFF}.score-area.image{--score:#FF9C42;--score-bg:#FFF4E8}.score-area.store{--score:#F06486;--score-bg:#FFF0F4}
.score-area-head{display:flex;gap:12px;align-items:center;padding:16px 17px;background:linear-gradient(115deg,var(--score-bg),#fff);border-bottom:1px solid #EDF3F6}
.score-area-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:#fff;font-size:22px;box-shadow:0 3px 9px rgba(9,63,90,.06)}.score-area-head h3{margin:0 0 3px;font-size:15px;line-height:1.3}.score-area-head p{margin:0;color:var(--mut);font-size:11.5px}
.score-question-list{padding:4px 16px 13px}.score-question{padding:12px 0;border-bottom:1px solid #EEF3F6}.score-question:last-child{border-bottom:0}.score-question-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.score-question-top>span{font-size:12.5px;line-height:1.45;color:#2C4D61;flex:1}.score-value{flex:0 0 auto;color:var(--score);font-size:17px;white-space:nowrap}.score-track{height:8px;border-radius:20px;background:#EDF3F6;overflow:hidden;margin:8px 0 4px}.score-track span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--score),color-mix(in srgb,var(--score) 65%,#fff));transition:width .35s}.score-question small{font-size:10.5px}
.database-card{padding:0;overflow:hidden}.database-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 22px;background:linear-gradient(120deg,#E8F9FF,#fff 80%);border-bottom:1px solid var(--line)}.database-title{display:flex;gap:12px;align-items:center;min-width:0}.database-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:14px;background:white;font-size:21px;box-shadow:0 3px 10px rgba(0,105,150,.08)}.database-title h3{font-size:17px;margin:0 0 4px}.database-title p{font-size:12px;color:var(--mut);margin:0;line-height:1.45}.database-count{padding:7px 11px;border-radius:999px;background:#DFF6FF;color:#007EAE;font-size:11px;font-weight:800;white-space:nowrap}
.database-search-row{padding:15px 20px 12px;background:#FBFEFF;border-bottom:1px solid #E8F1F5}.database-search-row>label{display:block;font-size:11.5px;color:#48677B;font-weight:800;margin-bottom:6px}.database-search{display:flex;align-items:center;gap:8px}.database-search>span{font-size:17px}.database-search input{min-width:0;flex:1;border-radius:11px;border-color:#CDE7F1;background:#fff}.database-search button{white-space:nowrap}

ace:normal;overflow-wrap:anywhere}.db-no-comments{color:var(--mut)}.database-empty{padding:28px;text-align:center;color:var(--mut);border-top:1px solid var(--line)}.database-empty span{font-size:28px}.database-empty b{display:block;color:#31566D;margin-top:5px}.database-empty p{margin:3px 0 0;font-size:12px}.database-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 20px;border-top:1px solid var(--line);background:#F8FCFE;color:var(--mut);font-size:11px}

const normBranch=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\bSUCURSAL\b/g,'SUC').replace(/[^A-Z0-9]/g,'').replace(/^SUC/,'');
function sucursalRespuesta(r){
 const nombre=normBranch(r&&r.sucursal);
 if(nombre){const porNombre=(D.sucursales||[]).find(s=>normBranch(s.sucursal)===nombre);if(porNombre)return porNombre;}
 const clave=normBranch(r&&r.key);
 if(clave){const porClave=(D.sucursales||[]).find(s=>normBranch(s.key)===clave||normBranch(s.sucursal)===clave);if(porClave)return porClave;}
 return (D.sucBy&&D.sucBy[r&&r.key])||{};
}

const lunes=m=>{const[y,mo]=m.split('-').map(Number),a=[];for(let d=new Date(Date.UTC(y,mo-1,1));d.getUTCMonth()==mo-1;d.setUTCDate(d.getUTCDate()+1))if(d.getUTCDay()==1)a.push(d.toISOString().slice(0,10));return a};

function cumpl(p,m){
 const rs=D.respuestas.filter(r=>r.persona===p&&mw(r)===m),v=rs.length,w=new Set(rs.map(r=>r.semanaInicio)).size,x=esperado(m);
 // Estado según el volumen mensual solicitado: 4+ concretadas, 2-3 concentradas, 1 por debajo y 0 sin visitas.
 let st;
 if(v>=4)st='Concretadas';
 else if(v>=2)st='Concentrada';
 else if(v===1)st='Atrasada';
 else st=x?'Sin visitas':'Pendiente';

}

const panelChip=st=>{const labels={'Concretadas':'✅ Visitas concretadas','Cumple':'✅ Meta cumplida','Al día':'🟢 Al día','Concentrada':'🟠 Visitas concentradas','Atrasada':'🔴 Por debajo del ritmo','Sin visitas':'🚫 Sin visitas registradas','Pendiente':'⏳ Pendiente'};return `<span class="chip ${cls(st)}">${e(labels[st]||st)}</span>`};
const avg=a=>{a=a.filter(v=>v!==null&&v!==undefined);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null};
const pct=v=>v===null?'s/d':Math.round(v*100)+'%',sem=v=>v===null?'gr':v>=.9?'ok':v>=.75?'warn':'bad',col={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)',gr:'#9AA6B1'};
const aScore=(rs,q)=>avg(rs.flatMap(r=>q.map(i=>r.scores[i])));
const filt=f=>D.respuestas.filter(r=>(!f.mes||mw(r)===f.mes)&&(!f.ciudad||depRespuesta(r)===f.ciudad)&&(!f.persona||r.persona===f.persona)&&(!f.sup||supRespuesta(r)===f.sup));
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.round(p*100))}%;background:${c}"></i></div>`;
const sel=(k,lab,opts,all)=>`<label>${lab}<select data-k="${k}">${all?`<option value="">${all}</option>`:''}${opts.map(o=>{o=Array.isArray(o)?o:[o,o];return`<option value="${e(o[0])}"${S[k]===o[0]?' selected':''}>${e(o[1])}</option>`}).join('')}</select></label>`;
const mesL=m=>{const[y,n]=m.split('-');return['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+n]+' '+y};
const mesOpts=()=>D.meses.map(m=>[m,mesL(m)]);
const meaningfulText=v=>{const t=String(v==null?'':v).trim();return !!t&&!/^(no requiere|ninguna?|ninguno|n\/a|na|-+|sin observaciones|no aplica)\.?$/i.test(t)};
const textItems=r=>Array.isArray(r.textos)?r.textos.filter(meaningfulText):[];
const textTotal=rs=>rs.reduce((n,r)=>n+textItems(r).length,0);
const hasText=r=>textItems(r).length>0;
const commentCount=(r,k)=>meaningfulText(r.textos&&r.textos[k])?1:0;
const scoreNum=v=>{
 if(v===null||v===undefined||v==='')return null;
 if(typeof v==='string'){
  const t=v.trim().toLowerCase();
  if(['sí','si','yes'].includes(t))return 1;
  if(['parcialmente','parcial','partial'].includes(t))return .5;
  if(['no','no cumple'].includes(t))return 0;
  if(['n/a','na','no aplica','sin respuesta'].includes(t))return null;
 }
 const n=Number(v);return Number.isFinite(n)&&n>=0&&n<=1?n:null;
};
const scoreText=v=>{const n=scoreNum(v);return n===null?'N/A o sin dato':n===1?'Sí · 100 %':n===.5?'Parcialmente · 50 %':n===0?'No · 0 %':'N/A o sin dato'};
const scoreStats=(rs,i)=>{const vals=rs.map(r=>scoreNum(r.scores&&r.scores[i])).filter(v=>v!==null);return{n:vals.length,p:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100):null}};

/* ---------- 3. Informe de resultados ---------- */
function informe(){
 const rs=filt({mes:S.im,persona:S.ip,sup:S.is,ciudad:S.ic}),n=rs.length;
 // El avance se presenta en una única tarjeta y responde al alcance seleccionado.
 // Mes seleccionado: objetivo de 4 visitas por colaborador (p. ej., 10 × 4 = 40).
 // Sin mes: avance de sucursales programadas visitadas, dentro del alcance elegido.
 const planBranch=f=>(D.sucBy&&D.sucBy[f.key])||(D.sucursales||[]).find(s=>
   (f.key&&normBranch(s.key)===normBranch(f.key)) ||
   (f.sucursal&&normBranch(s.sucursal)===normBranch(f.sucursal))
 )||{};
 const scopedPlanRows=(D.cronograma||[]).filter(f=>{
   if(S.ip&&normKey(f.persona)!==normKey(S.ip))return false;
   const su=planBranch(f);
   if(S.is&&normKey(su.supervisora)!==normKey(S.is))return false;
   if(S.ic&&normKey(su.departamento)!==normKey(S.ic))return false;
   return true;
 });
 const scopedPlanKeys=[...new Set(scopedPlanRows.map(f=>normBranch(f.key||f.sucursal)).filter(Boolean))];
 const scopedResponseKeys=new Set(rs.map(r=>normBranch(r.key||r.sucursal)).filter(Boolean));
 const scopedVisitedKeys=scopedPlanKeys.filter(k=>scopedResponseKeys.has(k));
 const scopedPeople=[...new Set(scopedPlanRows.map(f=>String(f.persona||'').trim()).filter(Boolean))];
 // El filtro de persona fija la meta en 4. Si se filtra por supervisora/departamento,
 // se calcula el objetivo agregado del equipo con asignaciones dentro de ese alcance.
 let monthlyPeopleCount;
 if(S.ip) monthlyPeopleCount=1;
 else if(S.is||S.ic) monthlyPeopleCount=scopedPeople.length;
 else monthlyPeopleCount=(D.equipo||[]).length;
 const expectedMonthlyVisits=monthlyPeopleCount*4;
 const actualMonthlyVisits=rs.length;
 const monthlyProgress=expectedMonthlyVisits?Math.round(actualMonthlyVisits/expectedMonthlyVisits*100):0;
 const progressValue=S.im?monthlyProgress:(scopedPlanKeys.length?Math.round(scopedVisitedKeys.length/scopedPlanKeys.length*100):0);
 const progressBarWidth=Math.min(100,Math.max(0,progressValue));
 const progressLabel=S.im?'🎯 Avance de la meta mensual':(S.ip||S.is||S.ic?'🎯 Avance de la selección':'🌐 Avance global del cronograma');
 const progressDetail=S.im
   ? `✅ ${actualMonthlyVisits} de ${expectedMonthlyVisits} visitas objetivo registradas en ${e(mesL(S.im))}. Meta de referencia: 4 visitas por colaborador.`
   : `✅ ${scopedVisitedKeys.length} de ${scopedPlanKeys.length} sucursales programadas con visita registrada en ${S.ip||S.is||S.ic?'el ámbito seleccionado':'todo el cronograma'}.`;
 const periodLabel=S.im?mesL(S.im):'todos los meses';
 const categories=TXT.map((t,k)=>({...t,k,items:rs.filter(r=>meaningfulText(r.textos&&r.textos[k])).map(r=>({text:String(r.textos[k]).trim(),sucursal:r.sucursal||'Sucursal sin identificar',fecha:r.fecha||'',persona:r.persona||''}))}));
 const questionGroups=AREAS.map(a=>({...a,questions:a.q.map(i=>({i,text:PREG[i],...scoreStats(rs,i)}))}));
 // La tabla usa exactamente el mismo conjunto filtrado que el resto del informe.
 const allRecords=[...rs].sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
 const dbRows=allRecords.map((r,index)=>{
  const su=sucursalRespuesta(r);
  const comments=(Array.isArray(r.textos)?r.textos:[]).map((v,i)=>meaningfulText(v)?{title:TXT[i]?TXT[i].title:'Comentario '+(i+1),icon:TXT[i]?TXT[i].icon:'💬',text:String(v).trim()}:null).filter(Boolean);
  const dbText=[r.fecha,r.semanaInicio,r.sucursal,r.key,su.sucursal,su.departamento,su.supervisora,su.horario,r.persona,r.regente,...PREG.map((q,i)=>q+' '+scoreText(r.scores&&r.scores[i])),...comments.flatMap(c=>[c.title,c.text])].filter(Boolean).join(' ');
  const qrows=PREG.map((q,i)=>`<div class="db-answer"><span>${e(q)}</span><b class="answer-pill ${scoreNum(r.scores&&r.scores[i])===1?'answer-yes':scoreNum(r.scores&&r.scores[i])===.5?'answer-partial':scoreNum(r.scores&&r.scores[i])===0?'answer-no':'answer-na'}">${e(scoreText(r.scores&&r.scores[i]))}</b></div>`).join('');
  const crows=comments.length?comments.map(c=>`<article class="db-comment"><b>${e(c.icon)} ${e(c.title)}</b><p>${e(c.text)}</p></article>`).join(''):'<p class="db-no-comments">Sin comentarios cualitativos registrados.</p>';
  return `<tr data-db-row data-search="${e(dbText.toLowerCase())}">
   <td>${e(r.fecha||'—')}</td>
   <td><b>${e(r.sucursal||su.sucursal||'Sucursal sin identificar')}</b><small>${e(r.key||'')}</small></td>
   <td>${e(su.departamento||'—')}</td><td>${e(su.supervisora||'Sin asignar')}</td><td>${e(tc(r.persona||''))}</td><td>${e(r.regente||'—')}</td>
   <td><span class="db-number">${PREG.reduce((count,_,i)=>count+(scoreNum(r.scores&&r.scores[i])!==null?1:0),0)}/12</span></td>
   <td><span class="db-number db-number-comments">${comments.length}</span></td>
   <td><details class="db-details"><summary>Ver detalle</summary><div class="db-detail-panel"><div><h4>✅ Evaluación de criterios</h4><p class="db-detail-help">Respuestas cerradas registradas para esta visita.</p><div class="db-answers">${qrows}</div></div><div><h4>💬 Comentarios literales</h4><p class="db-detail-help">Texto descriptivo tal como fue registrado.</p>${crows}</div></div></details></td>
  </tr>`;
 }).join('');
 return `<div class="filters">${sel('im','🗓️ Mes del informe',mesOpts(),'Todos')}${sel('ip','👤 Colaborador',D.personas.map(x=>[x,tc(x)]),'Todos')}${sel('is','🧑‍💼 Supervisora',D.sups,'Todas')}${sel('ic','📍 Departamento',D.deptos,'Todos')}</div>
 <section class="report-hero"><div class="hero-orb orb-one"></div><div class="hero-orb orb-two"></div><div class="hero-content"><span class="hero-eyebrow">📝 INFORME DE VISITAS</span><h3>Lo que estamos viendo en las sucursales</h3><p>Resumen de resultados cuantitativos de las preguntas cerradas y lectura cualitativa de los comentarios registrados. Los comentarios se mantienen como texto literal, sin asignarles porcentajes.</p></div><div class="hero-mark">💬</div></section>
 <div class="grid k5 report-kpis">
 <div class="card kpi kpi-cyan"><b>${n}</b><span>🧾 Visitas incluidas según los filtros seleccionados</span></div>
 <div class="card kpi kpi-green schedule-progress-card"><div class="schedule-progress-top"><b>${progressValue}%</b><span>${e(progressLabel)}</span></div><div class="schedule-progress-track"><span style="width:${progressBarWidth}%"></span></div><small>${progressDetail}</small></div>
 </div>
 ${n?'':'<div class="empty-state"><span>🔎</span><h3>No encontramos visitas con estos filtros</h3><p>Prueba con otro mes, colaborador, supervisora o departamento.</p></div>'}
 <div class="insight-heading"><div><span class="section-kicker">💬 VOZ DE LAS SUCURSALES</span><h3>🗣️ Observaciones por tema</h3></div><p>Los comentarios se presentan como fueron capturados para conservar su contexto original.</p></div>
 <div class="insight-grid">${categories.map(c=>`<section class="insight-card ${c.kind}"><div class="insight-head"><span class="insight-icon">${c.icon}</span><div class="insight-title-wrap"><h3>${e(c.title)}</h3><p>${e(c.subtitle)}</p></div><span class="insight-count">${c.items.length}</span></div><div class="insight-list">${c.items.length?c.items.map(it=>`<article class="comment-item"><p>${e(it.text)}</p><div class="comment-meta"><span>📍 ${e(it.sucursal)}</span>${it.fecha?`<span>📅 ${e(it.fecha)}</span>`:''}${it.persona?`<span>👤 ${e(tc(it.persona))}</span>`:''}</div></article>`).join(''):`<div class="insight-empty"><span>🌱</span><b>Aún no hay comentarios en esta categoría</b><small>Los registros nuevos aparecerán aquí cuando se incluyan en el informe.</small></div>`}</div></section>`).join('')}</div> <div class="insight-heading"><div><span class="section-kicker">📈 EVALUACIÓN CUANTITATIVA</span><h3>📊 Resultados por pregunta</h3></div><p>El porcentaje representa el promedio de la puntuación registrada para cada criterio. Se muestra también el número de respuestas válidas que lo sustentan.</p></div>
 <section class="score-note"><span>ℹ️</span><p><b>Cómo se calcula:</b> Sí = 100 %, Parcialmente = 50 %, No = 0 %. Las respuestas N/A, vacías o no reconocidas se excluyen del promedio. Los comentarios descriptivos no se convierten en porcentajes.</p></section>
 <div class="score-area-grid">${questionGroups.map(a=>`<section class="score-area ${a.kind}"><header class="score-area-head"><span class="score-area-icon">${a.icon}</span><div><h3>${e(a.n)}</h3><p>${a.questions.reduce((sum,q)=>sum+q.n,0)} respuestas válidas en esta área</p></div></header><div class="score-question-list">${a.questions.map(q=>`<div class="score-question"><div class="score-question-top"><span>${e(q.text)}</span><b class="score-value">${q.p===null?'Sin datos':q.p+'%'}</b></div><div class="score-track"><span style="width:${q.p===null?0:q.p}%;"></span></div><small>${q.n} ${q.n===1?'respuesta válida':'respuestas válidas'}</small></div>`).join('')}</div></section>`).join('')}</div>
 <div class="insight-heading"><div><span class="section-kicker">🗂️ EXPLORADOR DE REGISTROS</span><h3>🗂️ Base de datos de visitas</h3></div><p>Busca por sucursal, código, fecha, colaborador, supervisora, regente, departamento, respuesta o comentario. La tabla respeta los filtros de mes, colaborador, supervisora y departamento; el buscador encuentra registros dentro de esa selección.</p></div>
 <section class="card database-card"><div class="database-toolbar"><div class="database-title"><span class="database-icon">🔎</span><div><h3>🔎 Buscar en la base de datos</h3><p>La búsqueda se aplica a los registros que coinciden con los filtros del informe. Abre “Ver detalle” para consultar las 12 respuestas y los comentarios de cada visita.</p></div></div><div class="database-count" id="dbCount">${allRecords.length} registros</div></div>
 <div class="database-search-row"><label for="dbSearch">🔍 Buscar en los registros filtrados</label><div class="database-search"><span>🔍</span><input id="dbSearch" type="search" placeholder="Ej. SUC-64, Mirko, 2026-10, valores…" autocomplete="off"><button type="button" class="sec sm" id="clearDbSearch">🧹 Limpiar</button></div></div>
 <div class="database-table-wrap"><table class="database-table"><thead><tr><th>📅 Fecha</th><th>🏬 Sucursal</th><th>📍 Departamento</th><th>🧑‍💼 Supervisora</th><th>👤 Realizado por</th><th>🩺 Regente</th><th>✅ Respuestas</th><th>💬 Comentarios</th><th>🔎 Detalle</th></tr></thead><tbody id="dbBody">${dbRows||'<tr><td colspan="9">No hay registros que coincidan con estos filtros.</td></tr>'}</tbody></table></div>
 <div class="database-empty" id="dbEmpty" hidden><span>🕵️</span><b>No encontramos coincidencias</b><p>Prueba con otro nombre, sucursal o término.</p></div>
 <footer class="database-footer"><span>Mostrando registros que coinciden con los filtros seleccionados.</span><span id="dbFootCount">${allRecords.length} de ${allRecords.length} registros</span></footer></section>`

}
</script></body></html>
